<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedTest Pro | Internet Speed Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --dark: #14213d;
            --light: #f8f9fa;
            --danger: #e63946;
            --warning: #fca311;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0c2461, #1e3799);
            min-height: 100vh;
            color: var(--light);
            padding: 20px;
            overflow-x: hidden;
        }
        
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .app-header {
            background: rgba(20, 33, 61, 0.7);
            padding: 25px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            font-size: 32px;
            color: var(--success);
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #4cc9f0, #4361ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .server-selector-container {
            position: relative;
        }
        
        .server-selector {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 220px;
        }
        
        .server-selector:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .server-icon {
            font-size: 18px;
            color: var(--success);
        }
        
        .server-name {
            font-weight: 500;
            flex-grow: 1;
        }
        
        .server-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(20, 33, 61, 0.95);
            border-radius: 12px;
            margin-top: 10px;
            padding: 10px 0;
            z-index: 100;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .server-dropdown.active {
            display: block;
        }
        
        .server-option {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .server-option:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .server-option .flag {
            font-size: 24px;
            width: 30px;
        }
        
        .server-option .info {
            flex-grow: 1;
        }
        
        .server-option .info h4 {
            font-size: 16px;
            margin-bottom: 3px;
        }
        
        .server-option .info p {
            font-size: 13px;
            opacity: 0.7;
        }
        
        .server-option .latency {
            font-weight: 500;
            color: var(--success);
        }
        
        .app-body {
            padding: 30px;
        }
        
        .speed-test-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }
        
        @media (min-width: 992px) {
            .speed-test-container {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .test-section {
            background: rgba(20, 33, 61, 0.5);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .test-section:hover {
            transform: translateY(-5px);
        }
        
        .test-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--success);
            font-weight: 600;
        }
        
        .test-icon {
            font-size: 24px;
        }
        
        .gauge-container {
            position: relative;
            width: 100%;
            height: 200px;
            margin: 20px 0;
        }
        
        .gauge {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }
        
        .gauge-background {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                rgba(255, 255, 255, 0.1) 0deg, 
                rgba(255, 255, 255, 0.1) 180deg, 
                transparent 180deg, 
                transparent 360deg
            );
            border: 10px solid rgba(255, 255, 255, 0.05);
        }
        
        .gauge-fill {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                var(--primary) 0deg, 
                var(--secondary) 180deg, 
                transparent 180deg, 
                transparent 360deg
            );
            clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 50% 100%);
            transform: rotate(0deg);
            transition: transform 0.5s ease;
        }
        
        .gauge-fill.upload {
            background: conic-gradient(
                #f72585 0deg, 
                #b5179e 180deg, 
                transparent 180deg, 
                transparent 360deg
            );
        }
        
        .gauge-cover {
            position: absolute;
            width: 140px;
            height: 140px;
            background: var(--dark);
            border-radius: 50%;
            top: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        
        .gauge-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(to right, #4cc9f0, #4361ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .gauge-value.upload {
            background: linear-gradient(to right, #f72585, #b5179e);
        }
        
        .gauge-unit {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .test-results {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .result-item {
            text-align: center;
            flex: 1;
        }
        
        .result-value {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--success);
        }
        
        .result-label {
            font-size: 14px;
            opacity: 0.7;
        }
        
        .server-locations {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .server-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .server-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }
        
        .server-card.active {
            border-color: var(--success);
            background: rgba(76, 201, 240, 0.1);
        }
        
        .server-flag {
            font-size: 40px;
            margin-bottom: 15px;
        }
        
        .server-card h4 {
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .server-card p {
            opacity: 0.8;
            font-size: 14px;
        }
        
        .control-section {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            gap: 15px;
        }
        
        .test-button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
        }
        
        .test-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.6);
        }
        
        .test-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .test-button.cancel {
            background: linear-gradient(135deg, var(--danger), #c1121f);
        }
        
        .history-section {
            margin-top: 40px;
            background: rgba(20, 33, 61, 0.5);
            border-radius: 15px;
            padding: 25px;
        }
        
        .history-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--warning);
        }
        
        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            font-size: 14px;
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        
        .history-values {
            display: flex;
            justify-content: space-between;
        }
        
        .history-value {
            font-weight: 600;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            opacity: 0.7;
        }
        
        .progress-text {
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
            min-height: 24px;
            color: var(--success);
        }
        
        .spinner {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .progress-bar-container {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4cc9f0, #4361ee);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-bar.upload {
            background: linear-gradient(90deg, #f72585, #b5179e);
        }
        
        .section-title {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        
        .section-title h2 {
            display: inline-block;
            background: rgba(20, 33, 61, 0.7);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 500;
        }
        
        .section-title:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            z-index: -1;
        }
        
        .connection-quality {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }
        
        .quality-indicator {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .quality-indicator.good {
            background: rgba(76, 201, 240, 0.2);
            color: #4cc9f0;
        }
        
        .quality-indicator.moderate {
            background: rgba(252, 163, 17, 0.2);
            color: #fca311;
        }
        
        .quality-indicator.poor {
            background: rgba(230, 57, 70, 0.2);
            color: #e63946;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <div class="logo">
                <i class="fas fa-bolt logo-icon"></i>
                <h1 class="logo-text">SpeedTest Pro</h1>
            </div>
            <div class="server-selector-container">
                <div class="server-selector" id="serverSelector">
                    <i class="fas fa-server server-icon"></i>
                    <span class="server-name" id="selectedServerName">New York, USA</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="server-dropdown" id="serverDropdown">
                    <!-- Server options will be added here dynamically -->
                </div>
            </div>
        </div>
        
        <div class="app-body">
            <div class="speed-test-container">
                <div class="test-section">
                    <div class="test-title">
                        <i class="fas fa-download test-icon"></i>
                        <h2>Download Speed</h2>
                    </div>
                    <div class="gauge-container">
                        <div class="gauge">
                            <div class="gauge-background"></div>
                            <div class="gauge-fill" id="downloadGaugeFill"></div>
                            <div class="gauge-cover">
                                <div class="gauge-value" id="downloadValue">0</div>
                                <div class="gauge-unit">Mbps</div>
                            </div>
                        </div>
                    </div>
                    <div class="progress-text" id="downloadProgress">Ready to test</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="downloadProgressBar"></div>
                    </div>
                </div>
                
                <div class="test-section">
                    <div class="test-title">
                        <i class="fas fa-upload test-icon"></i>
                        <h2>Upload Speed</h2>
                    </div>
                    <div class="gauge-container">
                        <div class="gauge">
                            <div class="gauge-background"></div>
                            <div class="gauge-fill upload" id="uploadGaugeFill"></div>
                            <div class="gauge-cover">
                                <div class="gauge-value upload" id="uploadValue">0</div>
                                <div class="gauge-unit">Mbps</div>
                            </div>
                        </div>
                    </div>
                    <div class="progress-text" id="uploadProgress">Ready to test</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar upload" id="uploadProgressBar"></div>
                    </div>
                </div>
            </div>
            
            <div class="test-results">
                <div class="result-item">
                    <div class="result-value" id="pingValue">0</div>
                    <div class="result-label">Ping (ms)</div>
                </div>
                <div class="result-item">
                    <div class="result-value" id="jitterValue">0</div>
                    <div class="result-label">Jitter (ms)</div>
                </div>
                <div class="result-item">
                    <div class="result-value" id="packetLossValue">0.0</div>
                    <div class="result-label">Packet Loss (%)</div>
                </div>
            </div>
            
            <div class="connection-quality">
                <div class="quality-indicator" id="pingQuality">Ping: Good</div>
                <div class="quality-indicator" id="downloadQuality">Download: Good</div>
                <div class="quality-indicator" id="uploadQuality">Upload: Good</div>
            </div>
            
            <div class="control-section">
                <button class="test-button" id="startTest">
                    <i class="fas fa-play"></i>
                    Start Speed Test
                </button>
                <button class="test-button cancel" id="cancelTest" style="display: none;">
                    <i class="fas fa-stop"></i>
                    Cancel Test
                </button>
            </div>
            
            <div class="section-title">
                <h2>Select Server Location</h2>
            </div>
            
            <div class="server-locations" id="serverLocations">
                <!-- Server locations will be added here dynamically -->
            </div>
            
            <div class="history-section">
                <div class="history-title">
                    <i class="fas fa-history"></i>
                    <h3>Recent Tests</h3>
                </div>
                <div class="history-list" id="historyList">
                    <!-- History items will be added here dynamically -->
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>SpeedTest Pro © 2023 | Results may vary based on network conditions</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM elements
            const startTestBtn = document.getElementById('startTest');
            const cancelTestBtn = document.getElementById('cancelTest');
            const downloadValue = document.getElementById('downloadValue');
            const uploadValue = document.getElementById('uploadValue');
            const pingValue = document.getElementById('pingValue');
            const jitterValue = document.getElementById('jitterValue');
            const packetLossValue = document.getElementById('packetLossValue');
            const downloadProgress = document.getElementById('downloadProgress');
            const uploadProgress = document.getElementById('uploadProgress');
            const downloadGaugeFill = document.getElementById('downloadGaugeFill');
            const uploadGaugeFill = document.getElementById('uploadGaugeFill');
            const serverLocations = document.getElementById('serverLocations');
            const historyList = document.getElementById('historyList');
            const serverSelector = document.getElementById('serverSelector');
            const serverDropdown = document.getElementById('serverDropdown');
            const selectedServerName = document.getElementById('selectedServerName');
            const downloadProgressBar = document.getElementById('downloadProgressBar');
            const uploadProgressBar = document.getElementById('uploadProgressBar');
            const pingQuality = document.getElementById('pingQuality');
            const downloadQuality = document.getElementById('downloadQuality');
            const uploadQuality = document.getElementById('uploadQuality');
            
            // Server locations data
            const servers = [
                { id: 'ny', name: 'New York', location: 'USA', flag: '🇺🇸', latency: 15 },
                { id: 'lon', name: 'London', location: 'UK', flag: '🇬🇧', latency: 35 },
                { id: 'tk', name: 'Tokyo', location: 'Japan', flag: '🇯🇵', latency: 120 },
                { id: 'sf', name: 'San Francisco', location: 'USA', flag: '🇺🇸', latency: 45 },
                { id: 'sg', name: 'Singapore', location: 'Singapore', flag: '🇸🇬', latency: 180 },
                { id: 'sy', name: 'Sydney', location: 'Australia', flag: '🇦🇺', latency: 250 }
            ];
            
            // Selected server
            let selectedServer = servers[0];
            let isTesting = false;
            let animationFrameId = null;
            
            // Test history
            let testHistory = JSON.parse(localStorage.getItem('speedTestHistory')) || [];
            
            // Initialize the app
            function initApp() {
                renderServerLocations();
                renderServerDropdown();
                renderHistory();
                updateServerSelector();
                
                // Close dropdown when clicking outside
                document.addEventListener('click', function(e) {
                    if (!serverSelector.contains(e.target)) {
                        serverDropdown.classList.remove('active');
                    }
                });
            }
            
            // Render server locations
            function renderServerLocations() {
                serverLocations.innerHTML = '';
                
                servers.forEach(server => {
                    const isActive = server.id === selectedServer.id;
                    const serverCard = document.createElement('div');
                    serverCard.className = `server-card ${isActive ? 'active' : ''}`;
                    serverCard.innerHTML = `
                        <div class="server-flag">${server.flag}</div>
                        <h4>${server.name}</h4>
                        <p>${server.location}</p>
                        <p>${server.latency} ms</p>
                    `;
                    serverCard.addEventListener('click', () => {
                        if (isTesting) return;
                        selectedServer = server;
                        renderServerLocations();
                        updateServerSelector();
                    });
                    serverLocations.appendChild(serverCard);
                });
            }
            
            // Render server dropdown
            function renderServerDropdown() {
                serverDropdown.innerHTML = '';
                
                servers.forEach(server => {
                    const serverOption = document.createElement('div');
                    serverOption.className = 'server-option';
                    serverOption.innerHTML = `
                        <div class="flag">${server.flag}</div>
                        <div class="info">
                            <h4>${server.name}</h4>
                            <p>${server.location}</p>
                        </div>
                        <div class="latency">${server.latency}ms</div>
                    `;
                    serverOption.addEventListener('click', () => {
                        if (isTesting) return;
                        selectedServer = server;
                        updateServerSelector();
                        serverDropdown.classList.remove('active');
                        renderServerLocations();
                    });
                    serverDropdown.appendChild(serverOption);
                });
            }
            
            // Toggle server dropdown
            serverSelector.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isTesting) return;
                serverDropdown.classList.toggle('active');
            });
            
            // Update server selector text
            function updateServerSelector() {
                selectedServerName.textContent = `${selectedServer.name}, ${selectedServer.location}`;
            }
            
            // Render test history
            function renderHistory() {
                historyList.innerHTML = '';
                
                if (testHistory.length === 0) {
                    historyList.innerHTML = '<p class="text-center py-3">No test history available</p>';
                    return;
                }
                
                // Show only the last 6 tests
                const recentTests = testHistory.slice(-6).reverse();
                
                recentTests.forEach(test => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    historyItem.innerHTML = `
                        <div class="history-header">
                            <span>${test.date}</span>
                            <span>${test.server}</span>
                        </div>
                        <div class="history-values">
                            <div>
                                <span class="history-label">Download: </span>
                                <span class="history-value">${test.download} Mbps</span>
                            </div>
                            <div>
                                <span class="history-label">Upload: </span>
                                <span class="history-value">${test.upload} Mbps</span>
                            </div>
                        </div>
                        <div class="history-values">
                            <div>
                                <span class="history-label">Ping: </span>
                                <span class="history-value">${test.ping} ms</span>
                            </div>
                            <div>
                                <span class="history-label">Jitter: </span>
                                <span class="history-value">${test.jitter} ms</span>
                            </div>
                        </div>
                    `;
                    historyList.appendChild(historyItem);
                });
            }
            
            // Update connection quality indicators
            function updateQualityIndicators(download, upload, ping) {
                // Update ping quality
                if (ping < 50) {
                    pingQuality.textContent = "Ping: Excellent";
                    pingQuality.className = "quality-indicator good";
                } else if (ping < 100) {
                    pingQuality.textContent = "Ping: Good";
                    pingQuality.className = "quality-indicator good";
                } else if (ping < 200) {
                    pingQuality.textContent = "Ping: Fair";
                    pingQuality.className = "quality-indicator moderate";
                } else {
                    pingQuality.textContent = "Ping: Poor";
                    pingQuality.className = "quality-indicator poor";
                }
                
                // Update download quality
                if (download > 100) {
                    downloadQuality.textContent = "Download: Excellent";
                    downloadQuality.className = "quality-indicator good";
                } else if (download > 50) {
                    downloadQuality.textContent = "Download: Good";
                    downloadQuality.className = "quality-indicator good";
                } else if (download > 25) {
                    downloadQuality.textContent = "Download: Fair";
                    downloadQuality.className = "quality-indicator moderate";
                } else {
                    downloadQuality.textContent = "Download: Poor";
                    downloadQuality.className = "quality-indicator poor";
                }
                
                // Update upload quality
                if (upload > 50) {
                    uploadQuality.textContent = "Upload: Excellent";
                    uploadQuality.className = "quality-indicator good";
                } else if (upload > 25) {
                    uploadQuality.textContent = "Upload: Good";
                    uploadQuality.className = "quality-indicator good";
                } else if (upload > 10) {
                    uploadQuality.textContent = "Upload: Fair";
                    uploadQuality.className = "quality-indicator moderate";
                } else {
                    uploadQuality.textContent = "Upload: Poor";
                    uploadQuality.className = "quality-indicator poor";
                }
            }
            
            // Save test to history
            function saveToHistory(download, upload, ping, jitter) {
                const now = new Date();
                const testData = {
                    date: now.toLocaleString(),
                    server: `${selectedServer.name}, ${selectedServer.location}`,
                    download: download.toFixed(1),
                    upload: upload.toFixed(1),
                    ping: ping.toFixed(0),
                    jitter: jitter.toFixed(1),
                    packetLoss: (Math.random() * 0.5).toFixed(1)
                };
                
                testHistory.push(testData);
                localStorage.setItem('speedTestHistory', JSON.stringify(testHistory));
                renderHistory();
                
                // Update quality indicators
                updateQualityIndicators(download, upload, ping);
            }
            
            // Cancel the current test
            function cancelTest() {
                isTesting = false;
                
                // Cancel any ongoing animations
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                
                // Reset UI
                startTestBtn.disabled = false;
                startTestBtn.innerHTML = '<i class="fas fa-play"></i> Start Speed Test';
                cancelTestBtn.style.display = 'none';
                
                downloadProgress.textContent = 'Test canceled';
                uploadProgress.textContent = 'Test canceled';
            }
            
            // Start the speed test
            function startSpeedTest() {
                if (isTesting) return;
                
                isTesting = true;
                cancelTestBtn.style.display = 'inline-flex';
                
                // Reset values
                downloadValue.textContent = '0';
                uploadValue.textContent = '0';
                pingValue.textContent = '0';
                jitterValue.textContent = '0';
                packetLossValue.textContent = '0.0';
                
                // Reset gauges
                downloadGaugeFill.style.transform = 'rotate(0deg)';
                uploadGaugeFill.style.transform = 'rotate(0deg)';
                
                // Reset progress bars
                downloadProgressBar.style.width = '0%';
                uploadProgressBar.style.width = '0%';
                
                // Reset quality indicators
                pingQuality.textContent = "Ping: Testing...";
                pingQuality.className = "quality-indicator";
                downloadQuality.textContent = "Download: Testing...";
                downloadQuality.className = "quality-indicator";
                uploadQuality.textContent = "Upload: Testing...";
                uploadQuality.className = "quality-indicator";
                
                // Disable button during test
                startTestBtn.disabled = true;
                startTestBtn.innerHTML = '<i class="fas fa-sync-alt spinner"></i> Testing...';
                
                // Simulate ping test
                downloadProgress.textContent = 'Testing ping...';
                downloadProgressBar.style.width = '20%';
                
                // Use requestAnimationFrame for better performance
                const startTime = performance.now();
                
                // Ping test simulation
                setTimeout(() => {
                    const ping = Math.max(5, selectedServer.latency + Math.random() * 20 - 10);
                    const jitter = (Math.random() * 5).toFixed(1);
                    pingValue.textContent = ping.toFixed(0);
                    jitterValue.textContent = jitter;
                    
                    // Simulate packet loss
                    const packetLoss = (Math.random() * 0.5).toFixed(1);
                    packetLossValue.textContent = packetLoss;
                    
                    downloadProgressBar.style.width = '40%';
                    
                    // Simulate download test
                    downloadProgress.textContent = 'Testing download speed...';
                    simulateSpeedTest('download', 50, 300, (speed) => {
                        downloadValue.textContent = speed.toFixed(1);
                        downloadProgress.textContent = 'Download test complete!';
                        downloadProgressBar.style.width = '100%';
                        
                        // Simulate upload test
                        uploadProgress.textContent = 'Testing upload speed...';
                        uploadProgressBar.style.width = '40%';
                        
                        setTimeout(() => {
                            simulateSpeedTest('upload', 5, 50, (speed) => {
                                uploadValue.textContent = speed.toFixed(1);
                                uploadProgress.textContent = 'Upload test complete!';
                                uploadProgressBar.style.width = '100%';
                                
                                // Save to history
                                saveToHistory(
                                    parseFloat(downloadValue.textContent),
                                    parseFloat(uploadValue.textContent),
                                    parseFloat(pingValue.textContent),
                                    parseFloat(jitterValue.textContent)
                                );
                                
                                // Re-enable button
                                startTestBtn.disabled = false;
                                startTestBtn.innerHTML = '<i class="fas fa-play"></i> Start Speed Test';
                                cancelTestBtn.style.display = 'none';
                                isTesting = false;
                            });
                        }, 1000);
                    });
                }, 1500);
            }
            
            // Simulate speed test with progress using requestAnimationFrame
            function simulateSpeedTest(type, min, max, callback) {
                const duration = 3000; // 3 seconds
                const startTime = performance.now();
                const targetSpeed = min + Math.random() * (max - min);
                let lastUpdateTime = startTime;
                
                // Cancel any existing animation frame
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                }
                
                function animate(currentTime) {
                    if (!isTesting) return;
                    
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(1, elapsed / duration);
                    
                    // Simulate acceleration at start and deceleration at end
                    const progressEase = progress < 0.5 
                        ? 2 * progress * progress 
                        : -1 + (4 - 2 * progress) * progress;
                    
                    const currentSpeed = progressEase * targetSpeed;
                    
                    // Throttle DOM updates to 60fps
                    if (currentTime - lastUpdateTime > 16) {
                        lastUpdateTime = currentTime;
                        
                        // Update UI
                        if (type === 'download') {
                            downloadValue.textContent = currentSpeed.toFixed(1);
                            
                            // Update gauge rotation (0-180 degrees)
                            const rotation = progressEase * 180;
                            downloadGaugeFill.style.transform = `rotate(${rotation}deg)`;
                        } else {
                            uploadValue.textContent = currentSpeed.toFixed(1);
                            
                            // Update gauge rotation (0-180 degrees)
                            const rotation = progressEase * 180;
                            uploadGaugeFill.style.transform = `rotate(${rotation}deg)`;
                        }
                        
                        // Update progress bar
                        if (type === 'download') {
                            downloadProgressBar.style.width = `${progress * 100}%`;
                        } else {
                            uploadProgressBar.style.width = `${progress * 100}%`;
                        }
                    }
                    
                    // Check if test is complete
                    if (progress < 1) {
                        animationFrameId = requestAnimationFrame(animate);
                    } else {
                        callback(targetSpeed);
                        animationFrameId = null;
                    }
                }
                
                animationFrameId = requestAnimationFrame(animate);
            }
            
            // Event listeners
            startTestBtn.addEventListener('click', startSpeedTest);
            cancelTestBtn.addEventListener('click', cancelTest);
            
            // Initialize app
            initApp();
        });
    </script>
</body>
</html>
